# Every app on the site, in the order the home page lists them.
#
# status: live | review | testing | building
# store:  leave a key out until the listing is public.
# icon:   leave it out while the app still has the Expo placeholder icon; the
#         page then shows the app's initial on its colour.
# legal:  paths on this site, or full URLs for an app published elsewhere.
# how:    the steps of "So funktioniert's" on the app's page. A step shows
#         `media` (screenshots and screen recordings from the app) or a `demo`
#         (a drawing in _includes/how/, for an app with no recordings yet).
#         Describe only what the app does today, not what is planned.
# milestones: the app's history, oldest first, one entry per period of at
#         least a day: `date`, and `until` for a period of several days, a
#         `title` for the whole period and its changes as `points`. `key: true`
#         marks a step on the way into a store (a test track, a submission, a
#         release): a single day with a `text`, which the page shows larger.

- slug: plopp
  name: PLOPP
  tagline: Luftpolsterfolie zum Platzenlassen. Mit Münzen, Helfern und Talenten.
  about: >-
    Du wischst über ein Blatt Luftpolsterfolie und lässt so viele Blasen
    platzen, wie du in 20 Sekunden schaffst. Mit den Münzen kaufst du Helfer,
    die mitploppen. Jedes Level wird größer und härter.
  platforms: [iOS, Android]
  status: building
  icon: /assets/icons/plopp.webp
  colour: "#793ce5"
  store: {}
  legal: {}
  how:
    - title: Wischen, nicht tippen
      text: >-
        Eine Runde ist ein Blatt Folie und 20 Sekunden Zeit. Du reibst mit dem
        Finger über die Blasen. Jede Berührung macht Schaden, bis die Blase
        platzt. Goldblasen bringen fünfmal so viele Münzen und starten einen
        Goldrausch.
      media:
        - video: /assets/apps/plopp/runde.mp4
          poster: /assets/apps/plopp/runde.webp
          alt: Eine Runde PLOPP. Ein Finger wischt über die Folie, Blasen platzen, bis alles geploppt ist.
    - title: Zeit um oder alles geploppt
      text: >-
        Am Ende zählt, wie viel vom Blatt geplatzt ist. Für je 20 % bekommst du
        einen Stern. Ploppst du alle Blasen vor dem Ende, gibt es die Hälfte
        der Münzen noch einmal dazu.
      media:
        - image: /assets/apps/plopp/zeit-um.webp
          alt: "Ergebnis „Zeit um!“: 98 % der Blasen, 4 Sterne, 27.711 Münzen."
        - image: /assets/apps/plopp/alles-geploppt.webp
          alt: "Ergebnis, wenn alles geploppt ist: 100 % der Blasen, 5 Sterne, 68.950 Münzen."
    - title: Der Plopp-Shop
      text: >-
        Mit den Münzen machst du deinen Finger stärker und holst mehr Münzen
        aus jeder Blase. Mit genug Sternen kommen Helfer dazu, die von selbst
        ploppen: Blitz, Walze, Katze und Regen. Werbung siehst du nur, wenn du
        willst: Für ein Video gibt es einen Bonus, zum Beispiel mehr Münzen
        oder einen Helfer-Boost. Mit Premium bekommst du die Boni ohne Video.
      media:
        - video: /assets/apps/plopp/shop.mp4
          poster: /assets/apps/plopp/shop.webp
          alt: Der Plopp-Shop mit den Karten Finger, Münzen, Blitz, Walze, Katze und Regen.
    - title: Level, Prestige und Talente
      text: >-
        Mit 5 Sternen öffnet sich die Meisterrunde: alle Blasen in 16
        Sekunden. Schaffst du sie, ist das nächste Level spielbar, mit neuen
        Blasen wie Stahl und Schilden. Ab Level 3 kannst du Prestige machen.
        Dann fängst du bei Level 1 neu an und bekommst Punkte. Mit den Punkten
        kaufst du Talente, und die bleiben für immer.
      media:
        - image: /assets/apps/plopp/level.webp
          alt: "Die Übersicht zwischen den Runden: Level 5 von 10, 4 Sterne, der Knopf „Prestige +4“ und der Shop."
        - image: /assets/apps/plopp/start.webp
          alt: Der Startbildschirm von PLOPP mit Level, Sternen und Münzen.

  milestones:
    - date: 2026-10-20
      until: 2026-10-21
      title: Vom Browser zum Spiel
      points:
        - Das Spiel läuft als echte App, nicht mehr nur im Browser. Es hat Plopp-Töne, Vibration und den violetten Sticker-Look.
        - Eine Runde ist ein Blatt in 20 Sekunden, mit Sternen, Shop und reifen Blasen.
        - Die Helfer Blitz, Walze, Katze und Regen ploppen mit.
        - Prestige gibt dem Spiel ein Ziel. Du fängst neu an und baust sechs Talentbäume aus. Am Ende wartet ein Endlosmodus.
    - date: 2026-10-22
      title: Das Spielgefühl
      points:
        - Blasen wabbeln und ploppen mit Wucht. Münzen fliegen zum Zähler.
        - Alle Töne klingen in einer Tonart.
        - Das Spiel pausiert, wenn du die App wechselst.
        - Eine Hand zeigt neuen Spielern das Rubbeln.
    - date: 2026-10-23
      title: Musik, Intro und Premium
      points:
        - Musik läuft unter jedem Bildschirm, mit eigenem Regler.
        - Im Intro füllt sich die Folie im Takt. Eine Cartoon-Hand ploppt die ersten Blasen, und PLOPP landet Buchstabe für Buchstabe.
        - Für ein Video gibt es einen Bonus, mit Premium auch ohne Video. Farbthemen und Sounds kannst du vorher ansehen und anhören.
        - Klarere Namen. Aus Rolle wird Level, aus Meisterfolie Meisterrunde und aus Skillbäumen Talente. Ein neues Level und Prestige bekommen eine eigene Show.
        - App-Icon wurde generiert und ausgesucht.

- slug: grammgenau
  name: Grammgenau
  tagline: Ein Kalorienziel für Sportler, das jede Woche aus deinen eigenen Daten lernt.
  about: >-
    Grammgenau rechnet dein Tagesziel aus deinem Körper, deinem Alltag und
    deinem Sport aus. Jede Woche fragt es, ob das Ziel passt, und vergleicht
    deine Antwort mit deinen Wiegungen und deinem Essen. Alle Daten bleiben
    auf deinem Gerät.
  platforms: [Android]
  status: building
  colour: "#2f86f0"
  store: {}
  legal: {}
  how:
    - title: Berechnung der Kalorien
      text: >-
        Im Onboarding (noch nicht fertig) werden die Kalorien aus den üblichen
        Fragen nach dem Körpergewicht, der Größe, dem Alter und dem
        biologischen Geschlecht berechnet. Dazu kommen noch das Level der
        Alltagsbewegung und wie viel Sport du treibst. Anschließend kommt die
        Frage nach dem Ziel. Daraus berechnet Grammgenau dein Tagesziel. Das
        ist die Basis für alles.
      media:
        - image: /assets/apps/grammgenau/heute.webp
          alt: "„Heute“ mit dem Tagesziel von 2.800 kcal: 1.791 kcal sind noch offen, darunter Kohlenhydrate, Eiweiß und Fett in Gramm."
    - title: Essen eintragen
      text: >-
        Such einfach, was du gegessen hast, und gib die Gramm ein. Die App
        kennt den Bundeslebensmittelschlüssel und viele Markenprodukte. Die
        findest du auch über den Barcode. Automatische Rechtschreibprüfung
        inklusive. Auf „Heute“ siehst du dann, wie viel noch geht.
      media:
        - image: /assets/apps/grammgenau/suche.webp
          alt: "Die Suche nach „Kaese“ findet Gouda, Feta, Emmentaler und Mozzarella, jeweils mit kcal pro 100 g."
        - image: /assets/apps/grammgenau/menge.webp
          alt: "80 g Haferflocken ergeben 278 kcal. Darunter die Wahl der Mahlzeit und der Knopf „In Frühstück eintragen“."
    - title: Passt dein Ziel?
      text: >-
        Einmal die Woche fragt dich die App: Nimmst du ab, nimmst du zu, oder
        passt alles? Das vergleicht sie mit deinen Wiegungen und mit dem, was
        du gegessen hast. So merkt sie, was du wirklich brauchst, und schlägt
        dir ein neues Ziel vor. Je öfter du antwortest, desto genauer wird's.
      media:
        - image: /assets/apps/grammgenau/ziel.webp
          alt: "„Passt dein Ziel?“ mit den Antworten „Ich nehme ab“, „Ich nehme zu“ und „Passt“."
        - image: /assets/apps/grammgenau/ziel-neu.webp
          alt: "Nach „Ich nehme ab“: 1,1 kg weniger in 2 Wochen, aus dem Trend der Wiegungen. Das neue Ziel ist 3.120 kcal, 320 kcal mehr."

  milestones:
    - date: 2026-10-16
      title: Erste nutzbare Version
      points:
        - Du legst dein Profil an und bekommst ein tägliches Kalorienziel.
        - Du trägst dein Essen in Gramm ein, aus dem Bundeslebensmittelschlüssel.
        - „Heute“ fragt jede Woche, ob das Ziel passt, und passt es an. Dazu kommt eine animierte Waage.
    - date: 2026-10-18
      title: Rechner-Look, Barcode und Suche
      points:
        - „Heute“ und „Essen“ sehen aus wie ein Taschenrechner, mit Tasten für die Mahlzeiten, einem Kalorienbalken und Makro-Symbolen, die sich füllen.
        - Produkte findest du über den Barcode.
        - Du trägst dein Gewicht ein, und ein Verlauf zeigt die letzten Wochen. Vergessene Tage trägst du nach.
        - Die Suche versteht Alltagswörter wie „Käse“, verzeiht Tippfehler und findet Markenprodukte auch ohne Internet. Was du oft isst, steht oben.
    - date: 2026-10-20
      title: Ziel nach dem Gewichtstrend
      points:
        - Das Ziel rechnet mit dem geglätteten Trend deiner Wiegungen. Ein Tag mit viel Wasser im Körper verschiebt es nicht mehr.

- slug: movenote
  name: MoveNote
  tagline: Workouts als freien Text schreiben. Die App versteht, was du meinst.
  about: >-
    Du schreibst dein Workout wie eine Notiz. MoveNote liest den Text, erkennt
    Übungen, Sätze und Gewichte und bereitet dein nächstes Training vor.
    Alles bleibt auf deinem iPhone.
  platforms: [iOS]
  status: building
  icon: /assets/icons/movenote.webp
  colour: "#c6f432"
  store: {}
  legal: {}
  how:
    - title: Schreib, wie du denkst
      text: >-
        Die erste Zeile ist der Titel. Darunter steht jede Übung mit ihrem
        Ziel und ihrer Pause, zum Beispiel „3x8 2min“. Jede Zeile darunter ist
        ein Gewicht und die Wiederholungen jedes Satzes. Eine Leiste über der
        Tastatur zeigt dir die Zeichen, die gerade passen.
      demo: movenote-schreiben
    - title: Die App versteht den Text
      text: >-
        Aus „70 8 8 7V“ wird: 70 kg, drei Sätze, der letzte bis zum Versagen.
        Ein W steht für einen Aufwärmsatz, ein D für einen Dropsatz, 13/12 für
        links und rechts. Mit „=> 72.5“ legst du das Gewicht für das nächste
        Mal fest.
      demo: movenote-verstehen
    - title: Das nächste Mal ist schon vorbereitet
      text: >-
        Ein neues Workout übernimmt Übungen und Gewichte vom letzten Mal. Du
        tippst nur noch die Wiederholungen. Nach jedem Satz startet der
        Pausentimer von selbst, auch auf dem Sperrbildschirm. Am Ende siehst du
        Dauer, bewegtes Gewicht und Sätze.
      demo: movenote-vorbereitet

  milestones:
    - date: 2026-09-27
      until: 2026-09-29
      title: Erste Version
      points:
        - Ein Text-Editor liest Workouts, markiert falsche Zeilen rot und schlägt Übungen vom letzten Mal vor.
        - Ein Rechner zeigt den Bedarf für Ruhe- und Trainingstage, ein Kalorienziel aus dem Wochenziel und die Makros.
    - date: 2026-10-02
      until: 2026-10-03
      title: Pausentimer und der Name MoveNote
      points:
        - Zwischen den Sätzen läuft ein Pausentimer mit Signal, auch auf dem Sperrbildschirm und in der Dynamic Island.
        - Eine Leiste über der Tastatur zeigt die Zeichen, die gerade passen, und Vorschläge vom letzten Mal.
        - Die App heißt jetzt MoveNote und hat ein eigenes Icon.
    - date: 2026-10-06
      title: Planen und Strava
      points:
        - Ein Kalender zeigt geplante und gemachte Workouts, mit der geschätzten Dauer und dem Kalorienziel für jeden Tag.
        - Nach dem Workout siehst du Dauer und bewegtes Gewicht. Auf Wunsch geht das Workout zu Strava.
    - date: 2026-10-15
      title: Rückgängig und Wiederholen
      points:
        - Jede Änderung lässt sich rückgängig machen, auch ein gelöschtes Workout.

- slug: pubg-stream-report
  name: PUBG Stream Report
  tagline: Finde die PUBG-Momente, in denen du bei Twitch-Streamern im Bild warst.
  about: >-
    Gib deinen PUBG-Namen ein. Die App findet Runden, in denen du einen
    Streamer oder sein Team gekillt hast oder von ihnen gekillt wurdest. Ein
    Tipp springt an die Stelle im Twitch-VOD.
  platforms: [iOS, Android]
  status: testing
  icon: /assets/icons/pubg-stream-report.webp
  colour: "#f5a50b"
  store: {}
  legal:
    datenschutz: /pubg-stream-report/datenschutz/
    privacy: /pubg-stream-report/privacy/
  how:
    - title: Namen eingeben
      text: >-
        Gib deinen PUBG-Namen genau so ein wie im Spiel, mit Groß- und
        Kleinschreibung. Die App sucht Spieler auf dem PC (Steam). Ein Konto
        brauchst du nicht.
      media:
        - image: /assets/apps/pubg-stream-report/suche.webp
          alt: "Der Tab Suche: im Namensfeld „Halifax“, der Knopf „Suchen“ und die letzten Suchanfragen."
    - title: Die App gleicht ab
      text: >-
        Die App holt deine Matches der letzten 3 Tage von PUBG. Sie prüft jeden
        Kill und jeden Knock zwischen dir und einem anderen Team. War dort ein
        Streamer oder jemand aus seinem Team, der gerade live war, ist das ein
        Treffer. „Ältere Matches“ sucht 14 Tage zurück.
      demo: pubg-abgleich
    - title: Treffer ansehen
      text: >-
        Jeder Treffer zeigt, wer wen gekillt oder geknockt hat, mit Waffe,
        Entfernung und Uhrzeit. Ein Tipp öffnet das Twitch-VOD kurz vor dem
        Moment. Du kannst dich auch mit Streamern und Freunden vergleichen.
      media:
        - image: /assets/apps/pubg-stream-report/treffer.webp
          alt: "Treffer für Halifax vor 9 Tagen: grüne Karten für „Du hast … gekillt“, rote für „hat dich gekillt“. Treffer ohne VOD sind blasser."
    - title: Home und Stats
      text: >-
        Verbinde deinen PUBG-Namen mit der App. Dann zeigt Home deine neueste
        Begegnung, deine Stats und die PUBG-News, ohne dass du suchst. Der Tab
        Stats zeigt deine Zahlen für jeden Modus und jede Season, Normal und
        Ranked.
      media:
        - image: /assets/apps/pubg-stream-report/home.webp
          alt: "Home: die neueste Begegnung, „Alle Begegnungen“ (68), die Stats für Squad FPP und darunter die PUBG-News."
        - image: /assets/apps/pubg-stream-report/stats.webp
          alt: "Der Tab Stats für Halifax: Normal, Squad FPP, Season 43. K/D 2,56, 316 Schaden im Schnitt, 69 Siege, darunter die Details."
  milestones:
    - date: 2026-10-08
      until: 2026-10-11
      title: Vom Skript zur App
      points:
        - Ein Skript findet zu einem PUBG-Namen alle Kills und Knocks gegen Streamer und öffnet das Twitch-VOD kurz vor der Szene.
        - Die App liest das PUBG-Wasserzeichen im Vorschaubild eines Streams. So findet sie auch Streamer, deren PUBG-Name anders ist als ihr Twitch-Name.
        - Eine App für iOS und Android startet die Suche. Die Ergebnisse kommen live, mit einem Fortschrittsbalken.
        - Die App zeigt Werbung. Ein einmaliger Kauf schaltet sie ab.
        - Die App gibt es auch auf Englisch. Icon, Screenshots und Texte für App Store und Google Play sind fertig.
    - date: 2026-10-12
      title: Geschlossener Test bei Google Play
      key: true
      text: >-
        Die App ist im geschlossenen Test bei Google Play. Die ersten Tester
        laden sie aus dem Play Store, und ihre Rückmeldungen bestimmen die
        nächsten Schritte.
    - date: 2026-10-14
      until: 2026-10-18
      title: Teilen, Tabs und was die Tester sagen
      points:
        - Ein Treffer lässt sich als Link verschicken. Freunde sehen die Szene auch ohne App im Browser.
        - Du verbindest deinen PUBG-Namen mit der App. Tabs zeigen Home, Statistiken, PUBG-News und einen Vergleich mit Streamern oder Freunden.
        - Nach den ersten Rückmeldungen gibt es einen Willkommens-Bildschirm, „Feedback senden“ und mehr Rückmeldung beim Tippen.
    - date: 2026-10-22
      title: Bei Apple eingereicht
      key: true
      text: >-
        Version 1.1.0 liegt bei Apple zur Prüfung. Gibt Apple sie frei, kommt
        die App auch aufs iPhone.
